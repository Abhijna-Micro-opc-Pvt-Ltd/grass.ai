[package]
name = "grass-binary"
version = "0.1.0"
edition = "2021"
description = "grass.ai main binary entry point"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
grass-core = { workspace = true }
grass-runtime = { workspace = true }
grass-llm = { workspace = true }
grass-hooks = { workspace = true }
grass-protocol = { workspace = true }
grass-ipc = { workspace = true }
grass-sandbox = { workspace = true }
grass-plugin = { workspace = true }
grass-orchestrator = { workspace = true }
grass-blockchain = { workspace = true }
grass-integrations = { workspace = true }
grass-flow = { workspace = true }
grass-messaging = { workspace = true }
grass-inference = { workspace = true }
grass-iot = { workspace = true }
grass-streaming = { workspace = true }
grass-vector = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

